name: PR validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Compile application and test types
        run: npm run typecheck

      - name: Locate runner Chrome
        shell: bash
        run: |
          chrome_bin="$(command -v google-chrome)"
          "$chrome_bin" --version
          echo "CHROME_BIN=$chrome_bin" >> "$GITHUB_ENV"

      - name: Run tests in Chrome Headless
        run: npm run test:ci

      - name: Build production files
        run: npm run build -- --configuration production

      - name: Test generated HTML without JavaScript
        run: npm run test:html

      - name: Validate SEO routing under Apache
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y apache2 openssl
          bash scripts/check-http-seo.sh

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Reject high and critical tooling vulnerabilities
        # Angular 22: 8 moderate tooling findings; see docs/migrations/angular22.md.
        # No continue-on-error: high/critical findings and audit failures block this job.
        run: npm audit --audit-level=high

  mobile-menu:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install WebKit and system libraries
        run: npx playwright install --with-deps webkit

      - name: Test mobile menu in Chrome and WebKit
        # Edge is covered locally. WebKit skips only the three Chromium-specific probes.
        run: npm run test:e2e -- --project=chrome --project=webkit

      - name: Archive browser report and attached screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mobile-menu-browser-report
          path: tmp/mobile-menu/report/
          retention-days: 14
