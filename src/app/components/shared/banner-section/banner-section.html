<section class="banner-section" [style.background-image]="'url(' + bannerImage + ')'" [style.min-height]="heroHeader ? '100dvh' : '400px'">
  <div class="banner-backdrop-filter">
    <div class="banner-content fade-in" animateOnVisible="visible" [style.min-height]="heroHeader ? '100dvh' : '400px'">
      <h1>{{ bannerTitle }}</h1>
      <p class="banner-subtitle">{{ bannerSubtitle }}</p>
      @if (heroHeader) {
        <div class="buttons-container">
        <app-facebook-button></app-facebook-button>
        <a class="button about-button text-sm">Nous soutenir<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-right w-4 h-4 ml-2"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></a>
      </div>
      }
    </div>
  </div>
</section>
