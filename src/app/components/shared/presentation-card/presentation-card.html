<div class="card fade-in" animateOnVisible="visible">
  <div class="content fly-card">
    <div class="photo-content">
      <img [src]="card()!.photo_url" alt="{{ card()!.nom }}" class="card-photo zoom">
    </div>
    <div class="description-content">
      <h3>{{ card()!.nom }}</h3>
      <p class="role text-sm">{{ card()!.role }}</p>
      <p class="info text-sm" [innerHTML]="card()!.info | safeHtml"></p>
    </div>
  </div>
</div>
